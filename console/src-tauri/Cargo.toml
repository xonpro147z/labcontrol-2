[package]
name = "labcontrol-console"
version = "3.0.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/xonpro147z/labcontrol-2"
description = "LabControl Console – máy giáo viên"
edition = "2021"

[lib]
name = "labcontrol_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
anyhow = "1"
base64 = "0.22"
lc-core = { path = "../../crates/lc-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
