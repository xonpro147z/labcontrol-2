[package]
name = "lc-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"
hex = "0.4.3"
jpeg-encoder = "0.7.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-util"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["xfixes"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_HiDpi"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
