[package]
name = "labcontrol-agent"
version = "3.0.4"
license = "AGPL-3.0-or-later"
repository = "https://github.com/xonpro147z/labcontrol-2"
edition = "2021"
description = "LabControl Agent – chạy trên máy học sinh"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.37.0"
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
lc-core = { path = "../crates/lc-core" }
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.33"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"
